# Integração contínua: formatação, lint, tipos e testes (inclusive os de banco) a cada push.
# Os testes marcados como "lento" carregam o dataset real (data/raw, fora do git, D2) e
# ficam de fora aqui; todos os outros rodam contra um PostgreSQL 16 de verdade, com as
# mesmas migrações e o mesmo bootstrap do ambiente local.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VAREJO_DB_HOST: 127.0.0.1
      VAREJO_DB_PORT: "5432"
      VAREJO_DB_NAME: retail
      VAREJO_DB_NAME_TESTE: retail_teste
      VAREJO_DB_USER: varejo
      VAREJO_DB_PASSWORD: senha_so_do_ci
      VAREJO_BI_USER: varejo_bi
      VAREJO_BI_PASSWORD: senha_bi_so_do_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      # O mesmo bootstrap.sql do ambiente local (usuários sem privilégios extras, grupo de
      # leitura do Power BI, fuso, REVOKE do PUBLIC), com as variáveis pelo -v do psql.
      - name: Criar usuários e bancos
        env:
          PGPASSWORD: postgres
        run: >
          psql -X -h 127.0.0.1 -U postgres -d postgres
          -v usuario="$VAREJO_DB_USER" -v senha="$VAREJO_DB_PASSWORD"
          -v banco="$VAREJO_DB_NAME" -v banco_teste="$VAREJO_DB_NAME_TESTE"
          -v bi_usuario="$VAREJO_BI_USER" -v bi_senha="$VAREJO_BI_PASSWORD"
          -f db/bootstrap.sql

      - name: Formatação e lint
        run: |
          ruff format --check .
          ruff check .

      - name: Tipos
        run: mypy

      - name: Testes (sem os que carregam o dataset real)
        run: pytest -m "not lento"
